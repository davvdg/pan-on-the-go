; pan-on-the-go — firmware ESP32 WROOM-32
;
; Trois environnements, un par transport. Ils partagent tout le code sauf
; src/transport/. Choisis celui qui correspond à l'étape de la méthode :
;
;   esp32-serial  → étape 1-2, banc 4 pads, debug au laptop, zéro réseau
;   esp32-ws      → étape 5, dev sur le LAN (page de test en http://)
;   esp32-ble     → production, téléphone (page de test en https://)
;
;   pio run -e esp32-serial -t upload && pio device monitor

[env]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; huge_app : marge confortable pour la pile BLE (NimBLE ~600 ko)
board_build.partitions = huge_app.csv
build_flags =
    -Wall
    ; Nombre de pads réellement câblés. 4 pour le banc, 29 pour le tenor.
    -D PAD_COUNT=4
    ; Table pad→note : PADMAP_BENCH (écrite à la main) ou PADMAP_TENOR (générée)
    -D PADMAP_BENCH

[env:esp32-serial]
build_flags = ${env.build_flags} -D TRANSPORT_SERIAL

[env:esp32-ws]
build_flags = ${env.build_flags} -D TRANSPORT_WS
lib_deps =
    links2004/WebSockets@^2.4.1

[env:esp32-ble]
build_flags = ${env.build_flags} -D TRANSPORT_BLE
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
